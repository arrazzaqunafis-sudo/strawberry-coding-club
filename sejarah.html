<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Sejarah & Situs Ciamis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/sejarah.css" />
    <script src="https://unpkg.com/feather-icons" defer></script>
  </head>

  <body>
    <!-- HEADER NAVIGASI -->
    <header class="site-header scrolled">
      <nav class="navbar">
        <a class="navbar__logo" href="index.html">budaya<span>ciamis</span></a>
        <div class="navbar__links">
          <a href="index.html#home">Beranda</a>
          <a href="index.html#about">Tentang</a>
          <a href="sejarah.html" class="active">Sejarah</a>
          <a href="index.html#peta">Peta Wisata</a>
        </div>
        <a href="index.html" class="btn btn-outline-sm">← Kembali ke Beranda</a>
      </nav>
    </header>

    <main class="sejarah-page container">
      <!-- TAMPILAN DAFTAR SEJARAH -->
      <section id="daftar-sejarah">
        <div class="page-header">
          <span class="section__subtitle">Eksplorasi Peninggalan</span>
          <h1>Sejarah & Cagar Budaya Galuh</h1>
          <p>Daftar situs arkeologi, prasasti, dan kawasan adat peninggalan Kerajaan Galuh di Ciamis.</p>
          
          <div class="search-bar">
            <input type="text" id="input-cari" placeholder="Cari situs sejarah atau lokasi..." />
          </div>
        </div>

        <div class="kumpulan-sejarah" id="grid-sejarah">
          <!-- Item kartu sejarah akan dirender dinamis via Javascript -->
        </div>
      </section>

      <!-- TAMPILAN DETAIL SEJARAH -->
      <section id="detail-sejarah" class="detail-container" hidden>
        <button id="btn-kembali" class="btn-back">
          <i data-feather="arrow-left"></i> Kembali ke Daftar Sejarah
        </button>

        <article class="detail-card">
          <h1 id="judul-detail" class="detail-title"></h1>
          <div class="detail-image-box">
            <img id="gambar-detail" src="" alt="" />
          </div>
          <div id="isi-detail" class="detail-content"></div>
        </article>
      </section>
    </main>
    
    <script src="./js/sejarah.js" defer></script>
  </body>
</html>
